<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MailQ</title>
<meta name="description" content="Instant search for your Outlook and Gmail">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202226" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MailQ">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="tb">
    <div class="brand"><img class="lk lk-l" src="lockup.png" alt="MailQ"><img class="lk lk-d" src="lockup-dark.png" alt="MailQ"></div>
    <label class="search" for="q">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
      <input id="q" type="text" placeholder="Search subjects, people, attachments, or folders" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search mail">
      <button id="qClear" class="q-clear" type="button" title="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>
      </button>
      <kbd id="qHint" class="q-hint">⌘K</kbd>
    </label>
    <div class="seg" id="scope" role="tablist" aria-label="Folders">
      <button data-s="all" class="on" role="tab">All</button>
      <button data-s="inbox" role="tab">Inbox</button>
      <button data-s="sent" role="tab">Sent</button>
    </div>
    <button class="icon-btn labeled" id="insBtn" type="button" title="People: who emails you most, and when" aria-label="People" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18.5 14.4c1.8.8 3 2.8 3 5.6"/></svg><span class="lbl">People</span>
    </button>
    <button class="icon-btn" id="syncBtn" type="button" title="Check for new mail now" aria-label="Check for new mail">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <main>
    <section class="listpane" aria-label="Messages">
      <div id="banner" class="banner" hidden></div>
      <div id="deepBar" class="deepbar" hidden></div>
      <div id="list" tabindex="-1">
        <div id="listSpacer"></div>
        <div id="listRows"></div>
      </div>
      <div id="listEmpty" class="list-empty" hidden></div>
    </section>
    <div class="splitter split-list" role="separator" aria-orientation="vertical" aria-label="Drag to resize the message list" title="Drag to make the list wider or narrower. Double-click to reset." tabindex="0"></div>
    <section id="detail" class="detail" aria-label="Message details"></section>
    <section id="insights" class="insights" aria-label="Insights" hidden>
      <div class="ins-list">
        <div id="insCtl" class="ins-ctl"></div>
        <div id="insPeople" class="ins-people"></div>
      </div>
      <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Drag to resize the people list" title="Drag to make the list wider or narrower. Double-click to reset." tabindex="0"></div>
      <div id="insDetail" class="ins-detail"></div>
    </section>
  </main>

  <footer class="status">
    <span id="statusLeft"></span>
    <span class="status-right">
      <span id="statusBar" class="sbar" hidden><i></i></span>
      <span id="statusRight"></span>
    </span>
  </footer>

  <div id="overlay" class="overlay" hidden></div>
  <div id="modal" class="modal-back" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</div>

<script src="msal-browser.min.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
